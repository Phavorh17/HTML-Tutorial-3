<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pricing Comparison Table</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <nav>
        <h1>Acme Plans</h1>
        <ul>
            <li>Home</li>
            <li>About</li>
            <li>Contact</li>
        </ul>
    </nav>
    <main>
        <table>
            <caption>Plan comparison</caption>
            <thead>
                <tr>                
                    <td>Plan</td>
                    <td>Storage</td>
                    <td>Projects</td>
                    <td>Support</td>
                </tr>

            </thead>
            <tbody>
                <tr>
                    <td>Free</td>
                    <td>5 GB</td>
                    <td>3</td>
                    <td>Email</td>
                </tr>

                <tr>
                    <td>Pro</td>
                    <td>100 GB</td>
                    <td>25</td>
                    <td>Priority Email</td>
                </tr>

                 <tr>
                    <td>Business</td>
                    <td>1 TB</td>
                    <td>Unlimited</td>
                    <td>24/7 Phone</td>
                </tr>

                <tr>
                    <td colspan="4">All plans include SSL and daily backups</td>
                </tr>
            </tbody>
        </table>
    </main>

</body>
</html>
